<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="white"/>
  <!-- Body -->
  <ellipse cx="16" cy="14" rx="2" ry="3" fill="#6B4226"/>
  <ellipse cx="16" cy="20" rx="1.2" ry="5" fill="#6B4226"/>
  <ellipse cx="16" cy="27" rx="0.8" ry="3" fill="#8B5E3C"/>
  <!-- Head -->
  <circle cx="16" cy="10" r="2.2" fill="#5C3317"/>
  <!-- Eyes -->
  <circle cx="14.8" cy="9.5" r="0.8" fill="#3B1E0A"/>
  <circle cx="17.2" cy="9.5" r="0.8" fill="#3B1E0A"/>
  <!-- Upper wings (left) -->
  <ellipse cx="10" cy="12" rx="5.5" ry="2.2" fill="#8B6914" opacity="0.5" transform="rotate(-20 10 12)"/>
  <!-- Upper wings (right) -->
  <ellipse cx="22" cy="12" rx="5.5" ry="2.2" fill="#8B6914" opacity="0.5" transform="rotate(20 22 12)"/>
  <!-- Lower wings (left) -->
  <ellipse cx="11" cy="15" rx="4.5" ry="1.8" fill="#A0782C" opacity="0.45" transform="rotate(10 11 15)"/>
  <!-- Lower wings (right) -->
  <ellipse cx="21" cy="15" rx="4.5" ry="1.8" fill="#A0782C" opacity="0.45" transform="rotate(-10 21 15)"/>
  <!-- Wing veins -->
  <line x1="16" y1="13" x2="6" y2="11" stroke="#6B4226" stroke-width="0.3" opacity="0.4"/>
  <line x1="16" y1="13" x2="26" y2="11" stroke="#6B4226" stroke-width="0.3" opacity="0.4"/>
  <line x1="16" y1="14" x2="7" y2="15" stroke="#6B4226" stroke-width="0.3" opacity="0.4"/>
  <line x1="16" y1="14" x2="25" y2="15" stroke="#6B4226" stroke-width="0.3" opacity="0.4"/>
  <!-- Tail segments -->
  <line x1="16" y1="22" x2="16" y2="30" stroke="#5C3317" stroke-width="0.4" opacity="0.5"/>
</svg>
