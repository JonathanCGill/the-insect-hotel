site_name: The Insect Hotel
site_description: A boutique retreat for the discerning six-legged traveller. Solitude, nature, and endless foraging, all under one roof.
site_url: https://theinsecthotel.co.za/

theme:
  name: material
  custom_dir: overrides
  palette:
    primary: custom
    accent: amber
  font:
    text: Nunito
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
  favicon: assets/images/favicon.svg
  icon:
    logo: material/bee

plugins:
  - search:
      enabled: false
  - meta

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/world-map.js

nav:
  - Home: index.md
  - Guests: our-guests.md
  - Accommodation: accommodation.md
  - New Additions:
    - Bee Hotel: bee-hotel.md
    - Bug House Kit: bug-house-kit.md
  - Local Area: local-area.md
  - Rules: house-rules.md
  - Care Guide: care-guide.md
  - The Story: background.md
  - Reviews: reviews.md
  - Network: network.md
  - Book Now: book-your-stay.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JonathanCGill/the-insect-hotel

copyright: "&copy; 2026 The Insect Hotel. Where every bug is a welcome guest."
